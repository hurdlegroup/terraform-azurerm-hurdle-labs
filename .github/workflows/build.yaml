name: Build and Release

on:
  push:
    branches:
      - main
      - alpha
      - beta

permissions:
  id-token: write
  issues: write
  contents: write
  pull-requests: write
  packages: read

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check example output scope
        shell: bash
        run: |
          # Consumer outputs must cross the module boundary via module.* outputs.
          if git grep -nE 'value[[:space:]]*=.*(azurerm_|data\.|local\.)' -- 'examples/**/outputs.tf'; then
            echo "Example outputs must reference child-module outputs, not child-module implementation details." >&2
            exit 1
          fi

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Install dependencies
        run: npm ci

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Validate Terraform examples
        shell: bash
        run: |
          while IFS= read -r -d '' main_file; do
            example_dir="$(dirname "$main_file")"
            echo "Validating ${example_dir}"
            (cd "$example_dir" && terraform init -backend=false -input=false && terraform validate)
          done < <(find examples -name main.tf -print0 | sort -z)

      - name: Release
        run: npx semantic-release
